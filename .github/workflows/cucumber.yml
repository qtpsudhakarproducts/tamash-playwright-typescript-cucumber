name: Cucumber Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      # Temporarily testing copilot-subscription end-to-end in CI. Goes straight to a
      # personal-account PAT (COPILOT_GITHUB_TOKEN) rather than the ambient GITHUB_TOKEN +
      # copilot-requests: write permission — this repo is owned by the qtpsudhakarproducts ORG,
      # which doesn't itself have Copilot enabled (confirmed the hard way in the sibling
      # tamash-playwright-typescript-playwright repo's own CI test), even though the qtpsudhakar
      # personal account does. See tamash-playwright's own README for the full explanation.
      HEALER_ENABLED: true
      HEALER_PROVIDER: copilot-subscription
      COPILOT_SUBSCRIPTION_MODEL: mai-code-1-flash-picker
      APP_BASE_URL: https://qtpsudhakar-vibetestq-hrm.up.railway.app/
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run Cucumber tests
      run: npm test
    - name: Upload self-healing log
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: heals-log
        path: .tamash-playwright/heals.jsonl
        if-no-files-found: ignore
        retention-days: 7
